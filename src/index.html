<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Booster</title>
    <link rel="icon" type="svg" href="./img/Event-booster-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/olena.css" />
    <link rel="stylesheet" href="./css/vlad.css" />
    <link rel="stylesheet" href="./css/polina.css" />
  </head>
  <body>
    <header class="header container">
      <a href="./index.html" class="header-logo"
        ><img class="image-header-logo" src="./img/Event-booster-logo.svg" alt="logo"
      /></a>
      <h1 class="header-title">FIND BEST EVENTS <br />AROUND THE WORLD</h1>
     <div class="search-box">
      <div class="search-wrapper">
        <input class="event-search" type="text" placeholder="Start searching"/>
        <button class="event-search-btn" type="submit"><img src="./img/event-search.svg" alt=""></button>
      </div>
      <select class="countries">
        <option class="countries-options" value="">Choose country</option>
        <option class="countries-options" value="US">United States</option>
        <option class="countries-options" value="CA">Canada</option>
        <option class="countries-options" value="MX">Mexico</option>
        <option class="countries-options" value="AU">Australia</option>
        <option class="countries-options" value="NZ">New Zealand</option>
        <option class="countries-options" value="GB">United Kingdom</option>
        <option class="countries-options" value="IE">Ireland</option>
      </select>
    </div>
    </header>
    <main class="main container">
      <div class="backdrop hidden" id="modal">
        <div class="modalBody"></div>
      </div>
      <ul class="concerts"></ul>
      <div class="pagination-container"></div>
    </main>

    <footer class="footer container">
      <p class="footer-text">
        © 2021 | All Rights Reserved | Developed with <span class="heart">❤</span> by GoIT Students
      </p>
    </footer>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
